<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | Life Compass</title>
    <meta name="description" content="Nhận magic link để đăng nhập Life Compass." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Thanh điều hướng">
      <a class="brand" href="index.html" aria-label="Life Compass">
        <span class="brand-mark">L</span>
        <span>Life Compass</span>
      </a>
      <nav class="nav-links" aria-label="Liên kết chính">
        <a href="index.html#system">Hệ thống</a>
        <a href="index.html#method">Phương pháp</a>
        <a href="index.html#join">Đăng ký</a>
      </nav>
    </header>

    <main>
      <section class="auth-section">
        <div class="auth-copy">
          <p class="eyebrow">Magic link</p>
          <h1>Đăng nhập bằng email, không cần mật khẩu.</h1>
          <p>
            Nhập email đã dùng để gửi hồ sơ. Life Compass sẽ gửi một link đăng nhập riêng tư
            để bạn quay lại trang theo dõi.
          </p>
        </div>

        <form class="lead-form auth-form" id="login-form">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" placeholder="ban@domain.com" required />
          </label>
          <button class="button primary wide" type="submit">Gửi link đăng nhập</button>
          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="login.js" type="module"></script>
  </body>
</html>
